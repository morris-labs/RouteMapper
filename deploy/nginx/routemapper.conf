# Both API endpoints spend quota on the Google server key. There's no auth,
# so this is the cheapest real backstop against a scripted hammer loop:
# 1 req/sec sustained per IP, with a burst allowance for normal typing
# during autocomplete.
limit_req_zone $binary_remote_addr zone=routemapper_api:10m rate=60r/m;

server {
    listen 80;
    server_name morrislabs.app www.morrislabs.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name morrislabs.app www.morrislabs.app;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /routemapper {
        return 301 /routemapper/;
    }

    location /routemapper/api/ {
        limit_req zone=routemapper_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /routemapper/ {
        alias /opt/routemapper/client/dist/;
        try_files $uri $uri/ /routemapper/index.html;
    }

    # WeatherMapper — static site, no backend process.
    include /opt/weathermapper/deploy/nginx/weathermapper.conf;

    # MorrisLabs home page — Node/Express on 127.0.0.1:3000.
    include /opt/morrislabs/deploy/nginx/morrislabs.conf;
}
