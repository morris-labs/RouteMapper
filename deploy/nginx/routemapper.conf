server {
    listen 80;
    server_name morrislabs.app www.morrislabs.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name morrislabs.app www.morrislabs.app;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # No landing page at the domain root yet; send visitors to the app.
    location = /routemapper {
        return 301 /routemapper/;
    }

    location = / {
        return 302 /routemapper/;
    }

    location /routemapper/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /routemapper/ {
        alias /opt/routemapper/client/dist/;
        try_files $uri $uri/ /routemapper/index.html;
    }
}
